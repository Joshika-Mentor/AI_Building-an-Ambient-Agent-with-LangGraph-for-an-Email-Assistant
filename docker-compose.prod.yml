# ─────────────────────────────────────────────────────────────────────
# ThreatLens AI — Production Docker Compose
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires: .env.production (copy from .env.production and fill secrets)
# ─────────────────────────────────────────────────────────────────────

services:
  # ─── Data Layer ───────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: threatlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-threatlens_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB ports NOT exposed to host in production (internal network only)
    networks:
      - threatlens-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatlens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  mongodb:
    image: mongo:7
    container_name: threatlens-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - threatlens-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: threatlens-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - threatlens-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─── Backend (FastAPI) — Production ──────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatlens-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-threatlens}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-threatlens_db}
      MONGODB_URL: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatlens-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # Production: uses CMD from Dockerfile (4 uvicorn workers, no --reload)

  # ─── Frontend (Next.js) — Production ────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: threatlens-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - threatlens-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # Production: uses CMD from Dockerfile (node server.js, standalone)

  # ─── Nginx Reverse Proxy ────────────────────────────────────────

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: threatlens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - threatlens-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  upload_data:

networks:
  threatlens-internal:
    driver: bridge
